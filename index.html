<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little League World Series 2026 - Participant Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #2a5298;
            padding-bottom: 10px;
        }

        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .participant-card {
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .participant-card:hover {
            transform: translateY(-5px);
        }

        .participant-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 15px;
            text-align: center;
        }

        .team-assignment {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.7);
        }

        .team-type {
            font-weight: bold;
            color: #495057;
        }

        .team-name {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
            background-color: #28a745;
        }

        .team-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .team-location {
            font-size: 0.75em;
            font-weight: normal;
            color: #6c757d;
            padding-right: 2px;
        }

        .team-eliminated {
            background-color: #6c757d;
        }

        .team-elimination {
            background-color: #ffc107;
            color: #212529;
        }

        .team-championship {
            background-color: #ffd700;
            color: #212529;
        }

        .team-winner {
            background-color: #ffd700;
            color: #212529;
        }

        .participant-status {
            text-align: center;
            margin-top: 15px;
            padding: 8px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            background-color: #17a2b8;
        }

        .participant-status-1-team {
            background-color: #ffc107;
            color: #212529;
        }

        .participant-status-eliminated {
            background-color: #dc3545;
            color: white;
        }

        .participant-status-champion {
            background-color: #ffd700;
            color: #212529;
        }

        .bracket-note {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #856404;
        }

        .games-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .game-result {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #28a745;
            flex-wrap: wrap;
            gap: 10px;
        }

        .game-info {
            flex: 1;
            min-width: 200px;
        }

        .game-teams {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .winner {
            color: #28a745;
        }

        .loser {
            color: #6c757d;
        }

        .game-score {
            font-size: 1.2em;
            font-weight: bold;
            color: #1e3c72;
            margin-left: 15px;
        }

        .game-meta {
            font-size: 0.9em;
            color: #666;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 30px;
            font-size: 1.1em;
        }

        .spotlight {
            background: linear-gradient(135deg, #ffd700, #ffed4e, #ffd700);
            border: 4px solid #e6c200;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .spotlight h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .spotlight-sub {
            font-size: 1.3em;
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .matchup-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
        }

        .matchup-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .matchup-side {
            text-align: center;
            flex: 1;
            min-width: 200px;
            margin: 10px;
        }

        .matchup-emoji {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .matchup-team {
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .matchup-participant {
            font-size: 1.2em;
            font-weight: bold;
            color: #1e3c72;
        }

        .matchup-record {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .matchup-vs {
            font-size: 3em;
            font-weight: bold;
            color: #1e3c72;
            margin: 0 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 768px) {
            .matchup-row {
                flex-direction: column;
            }
            .matchup-vs {
                font-size: 2em;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>⚾ Little League World Series 2026</h1>
            <p id="headerLocation"><strong></strong></p>
            <p>Participant Competition Tracker</p>
            <p style="font-size: 0.9em; color: #888; margin-top: 10px;">
                <em id="headerUpdated"></em>
            </p>
        </div>

        <!-- Notes / callouts -->
        <div id="notesContainer"></div>

        <!-- Spotlight: draft info, championship matchup, or final winner -->
        <div class="section" id="spotlightSection"></div>

        <!-- Participant Dashboard -->
        <div class="section">
            <h2>👥 Participant Dashboard</h2>
            <div class="participants-grid" id="participantGrid"></div>
        </div>

        <!-- Game Results -->
        <div class="section">
            <h2>🎮 Game Results</h2>
            <div class="games-container" id="gamesContainer"></div>
        </div>

        <!-- Tournament Statistics -->
        <div class="section">
            <h2>📈 Tournament Statistics & Fun Facts</h2>
            <div class="games-container" id="statsContainer"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        const teamToParticipant = {};
        participants.forEach(p => {
            teamToParticipant[p.usTeam] = p.name;
            teamToParticipant[p.intlTeam] = p.name;
        });

        function bracketIcon(bracket) {
            if (bracket === 'Winner') return '🟢';
            if (bracket === 'Championship') return '🏆';
            if (bracket === 'ELIMINATED') return '🔴';
            if (bracket === 'Elimination') return '🟠';
            return '🟡';
        }

        function teamClass(bracket) {
            let cls = 'team-name';
            if (bracket === 'ELIMINATED') cls += ' team-eliminated';
            else if (bracket === 'Elimination') cls += ' team-elimination';
            else if (bracket === 'Championship') cls += ' team-championship';
            else if (bracket === 'Winner') cls += ' team-winner';
            return cls;
        }

        function participantActiveTeamCount(p) {
            const us = teamStatus[p.usTeam];
            const intl = teamStatus[p.intlTeam];
            return (us.bracket !== 'ELIMINATED' ? 1 : 0) + (intl.bracket !== 'ELIMINATED' ? 1 : 0);
        }

        function renderHeader() {
            document.getElementById('headerLocation').innerHTML =
                `<strong>${TOURNAMENT.location} | ${TOURNAMENT.dates}</strong>`;
            document.getElementById('headerUpdated').textContent = `Last updated: ${TOURNAMENT.lastUpdated}`;
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            if (!notes.length) return;
            const html = notes.map(n => `<div class="bracket-note">${n}</div>`).join('');
            container.innerHTML = html;
        }

        function renderSpotlight() {
            const section = document.getElementById('spotlightSection');
            const remaining = participants.filter(p => participantActiveTeamCount(p) > 0);
            const started = games.length > 0;

            if (!started) {
                section.innerHTML = `
                    <h2>🗓️ Draft Complete - Tournament Starts ${TOURNAMENT.dates.split(' - ')[0]}</h2>
                    <div class="bracket-note">
                        All ${participants.length} participants have their regions locked in. Check back once pool play begins!
                    </div>
                `;
                return;
            }

            if (remaining.length >= 2) {
                const champTeams = participants.flatMap(p => {
                    const entries = [];
                    if (teamStatus[p.usTeam].bracket === 'Championship') entries.push({ participant: p.name, team: p.usTeam });
                    if (teamStatus[p.intlTeam].bracket === 'Championship') entries.push({ participant: p.name, team: p.intlTeam });
                    return entries;
                });

                if (champTeams.length === 2) {
                    const [a, b] = champTeams;
                    const aStatus = teamStatus[a.team];
                    const bStatus = teamStatus[b.team];
                    section.innerHTML = `
                        <div class="spotlight">
                            <div style="font-size: 3em; margin-bottom: 10px;">🏆</div>
                            <h1>LLWS CHAMPIONSHIP GAME</h1>
                            <div class="spotlight-sub">${a.participant} vs ${b.participant} - Winner takes all!</div>
                            <div class="matchup-card">
                                <div class="matchup-row">
                                    <div class="matchup-side">
                                        <div class="matchup-emoji">${regionEmoji[a.team] || '⚾'}</div>
                                        <div class="matchup-team" style="background:#dc3545;">${a.team}</div>
                                        <div class="matchup-participant">${a.participant}</div>
                                        <div class="matchup-record"><strong>Record:</strong> ${aStatus.record}</div>
                                    </div>
                                    <div class="matchup-vs">⚡ VS ⚡</div>
                                    <div class="matchup-side">
                                        <div class="matchup-emoji">${regionEmoji[b.team] || '⚾'}</div>
                                        <div class="matchup-team" style="background:#17a2b8;">${b.team}</div>
                                        <div class="matchup-participant">${b.participant}</div>
                                        <div class="matchup-record"><strong>Record:</strong> ${bStatus.record}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    return;
                }

                section.innerHTML = `
                    <h2>🏟️ Tournament In Progress</h2>
                    <div class="bracket-note">
                        <strong>${remaining.length} of ${participants.length} participants</strong> still have at least one team alive.
                    </div>
                `;
                return;
            }

            if (remaining.length === 1) {
                const champ = remaining[0];
                section.innerHTML = `
                    <div class="spotlight">
                        <div style="font-size: 3em; margin-bottom: 10px;">👑</div>
                        <h1>${champ.name} WINS IT ALL!</h1>
                        <div class="spotlight-sub">Congratulations on your 2026 LLWS championship!</div>
                    </div>
                `;
                return;
            }

            section.innerHTML = `<div class="bracket-note">All teams eliminated - awaiting final results.</div>`;
        }

        function renderParticipantCards() {
            const grid = document.getElementById('participantGrid');
            const sortedParticipants = participants.slice().sort((a, b) => a.name.localeCompare(b.name));
            grid.innerHTML = sortedParticipants.map(p => {
                const usStatus = teamStatus[p.usTeam];
                const intlStatus = teamStatus[p.intlTeam];
                const activeTeams = participantActiveTeamCount(p);

                let statusClass = 'participant-status';
                let statusText = '2 Teams Active';
                if (activeTeams === 0) {
                    statusClass += ' participant-status-eliminated';
                    statusText = 'ELIMINATED';
                } else if (usStatus.bracket === 'Winner' || intlStatus.bracket === 'Winner') {
                    statusClass += ' participant-status-champion';
                    statusText = '🏆 CHAMPION 🏆';
                } else if (activeTeams === 1) {
                    statusClass += ' participant-status-1-team';
                    statusText = '1 Team Active';
                }

                return `
                    <div class="participant-card">
                        <div class="participant-name">${p.name}</div>
                        <div class="team-assignment">
                            <span class="team-type">🇺🇸 US:</span>
                            <span class="team-info">
                                <span class="${teamClass(usStatus.bracket)}">
                                    ${bracketIcon(usStatus.bracket)} ${p.usTeam} (${usStatus.record})
                                </span>
                                <span class="team-location">${regionTeamLocation[p.usTeam] || ''}</span>
                            </span>
                        </div>
                        <div class="team-assignment">
                            <span class="team-type">🌍 Intl:</span>
                            <span class="team-info">
                                <span class="${teamClass(intlStatus.bracket)}">
                                    ${bracketIcon(intlStatus.bracket)} ${p.intlTeam} (${intlStatus.record})
                                </span>
                                <span class="team-location">${regionTeamLocation[p.intlTeam] || ''}</span>
                            </span>
                        </div>
                        <div class="${statusClass}">${statusText}</div>
                    </div>
                `;
            }).join('');
        }

        function renderGames() {
            const container = document.getElementById('gamesContainer');
            if (!games.length) {
                container.innerHTML = `<div class="empty-state">No games played yet - check back once pool play starts on ${TOURNAMENT.dates.split(' - ')[0]}!</div>`;
                return;
            }

            container.innerHTML = games.slice().reverse().map(g => {
                const team1IsWinner = g.winner === g.team1;
                return `
                    <div class="game-result">
                        <div class="game-info">
                            <div class="game-teams">
                                <span class="${team1IsWinner ? 'winner' : 'loser'}">${g.team1} (${teamToParticipant[g.team1] || '?'})</span>
                                vs
                                <span class="${!team1IsWinner ? 'winner' : 'loser'}">${g.team2} (${teamToParticipant[g.team2] || '?'})</span>
                            </div>
                            <div class="game-meta">${g.game} - ${g.gameType} - ${g.date}</div>
                        </div>
                        <div class="game-score">${g.team1Score} - ${g.team2Score}</div>
                    </div>
                `;
            }).join('');
        }

        function renderStats() {
            const container = document.getElementById('statsContainer');
            if (!games.length) {
                container.innerHTML = `<div class="empty-state">Stats will appear here once games are underway.</div>`;
                return;
            }

            const withMargin = games.map(g => ({ ...g, margin: Math.abs(g.team1Score - g.team2Score) }));
            const biggestBlowout = withMargin.reduce((a, b) => (b.margin > a.margin ? b : a));
            const closestGame = withMargin.reduce((a, b) => (b.margin < a.margin ? b : a));

            const eliminatedParticipants = participants.filter(p => participantActiveTeamCount(p) === 0);

            const winCounts = {};
            games.forEach(g => { winCounts[g.winner] = (winCounts[g.winner] || 0) + 1; });
            const topTeam = Object.entries(winCounts).sort((a, b) => b[1] - a[1])[0];

            const stats = [
                {
                    label: '🎮 Games Played',
                    meta: `${games.length} game${games.length === 1 ? '' : 's'} completed so far`,
                    value: games.length
                },
                {
                    label: '⚾ Biggest Blowout',
                    meta: `${biggestBlowout.team1} ${biggestBlowout.team1Score}, ${biggestBlowout.team2} ${biggestBlowout.team2Score}`,
                    value: `${biggestBlowout.margin}-run margin`
                },
                {
                    label: '🎯 Closest Game',
                    meta: `${closestGame.team1} ${closestGame.team1Score}, ${closestGame.team2} ${closestGame.team2Score}`,
                    value: closestGame.margin === 0 ? 'TIE' : `${closestGame.margin}-run margin`
                },
                {
                    label: '💥 Eliminated Participants',
                    meta: eliminatedParticipants.length ? eliminatedParticipants.map(p => p.name).join(', ') : 'None yet',
                    value: `${eliminatedParticipants.length} out`
                }
            ];

            if (topTeam) {
                stats.push({
                    label: '🔥 Most Wins (Single Team)',
                    meta: `${topTeam[0]} (${teamToParticipant[topTeam[0]] || '?'})`,
                    value: `${topTeam[1]} win${topTeam[1] === 1 ? '' : 's'}`
                });
            }

            container.innerHTML = stats.map(s => `
                <div class="game-result">
                    <div class="game-info">
                        <div class="game-teams">${s.label}</div>
                        <div class="game-meta">${s.meta}</div>
                    </div>
                    <div class="game-score">${s.value}</div>
                </div>
            `).join('');
        }

        function render() {
            renderHeader();
            renderNotes();
            renderSpotlight();
            renderParticipantCards();
            renderGames();
            renderStats();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
